name: Mirror to Codeberg

on:
  push:
  delete:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly safety net in case an event-triggered run failed

jobs:
  mirror:
    uses: fiscusproject/.github/.github/workflows/mirror.yml@master
    permissions:
      contents: read
    secrets:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
